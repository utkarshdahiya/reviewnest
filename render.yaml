databases:
  - name: reviewnest-db
    plan: free

services:
  - type: web
    name: reviewnest
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma db push --skip-generate && npx prisma generate
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reviewnest-db
          property: connectionString
